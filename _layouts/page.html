<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} — JellyJam</title>
  <meta name="theme-color" content="#0a0618">
  <link rel="icon" href="{{ '/assets/logo.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/assets/logo.svg' | relative_url }}" alt="">JELLYJAM</a>
    </div>
  </header>
  <main id="main" class="page">
    <div class="wrap">
      <article>
        {{ content }}
      </article>
    </div>
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <span>© iteration3</span>
      <nav aria-label="Footer">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="https://github.com/iteration3-games/JellyJam">GitHub</a>
      </nav>
    </div>
  </footer>
</body>
</html>
